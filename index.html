<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>投资日历 · 每日更新市场大事</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
/* ===== 设计 token ===== */
:root{
  --bg:#0E1218;
  --bg-2:#111722;
  --surface:#161D27;
  --surface-2:#1C2531;
  --line:#25303E;
  --line-2:#31405A;
  --ink:#EAE7E0;
  --ink-dim:#9AA3AF;
  --ink-faint:#5F6875;
  --amber:#E8A33D;
  --amber-deep:#B97E2C;
  --red:#E5484D;      /* 国内 / 政策 */
  --blue:#5AA9E6;     /* 海外宏观 */
  --orange:#E8863D;   /* AI / 科技 */
  --teal:#35B29A;     /* 新能源 / 电池 */
  --serif:"Noto Serif SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:var(--sans);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(232,163,61,0.05), transparent 60%),
    var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px;}
a{color:inherit;}

/* ===== 顶栏 ===== */
.app-header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, rgba(14,18,24,0.96), rgba(14,18,24,0.86));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1600px;margin:0 auto;
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:18px;min-width:0;}
.brand-logo{display:flex;align-items:center;flex-shrink:0;text-decoration:none;}
.brand-logo img{display:block;height:72px;width:auto;border-radius:8px;}
.brand .sub{
  font-size:15px;color:var(--ink-dim);line-height:1.6;letter-spacing:.3px;
  padding-left:16px;border-left:1px solid var(--line);
  max-width:560px;
}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px;}
.seg{
  display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:5px;gap:3px;
}
.seg button{
  font-size:15px;font-weight:600;padding:9px 26px;border-radius:8px;color:var(--ink-dim);
  min-height:44px;transition:background .15s,color .15s;letter-spacing:.5px;
}
.seg button.active{background:var(--amber);color:#171207;box-shadow:0 2px 10px rgba(232,163,61,0.25);}
.today-btn{
  font-size:14.5px;color:var(--ink-dim);border:1px solid var(--line);border-radius:9px;
  padding:10px 18px;min-height:44px;transition:border-color .15s,color .15s,background .15s;
  font-weight:500;letter-spacing:.5px;
}
.today-btn:hover{color:var(--amber);border-color:var(--amber-deep);background:rgba(232,163,61,0.06);}
.export-btn{
  display:inline-flex;align-items:center;gap:7px;
  font-size:14.5px;color:var(--ink-dim);border:1px solid var(--line);border-radius:9px;
  padding:10px 18px;min-height:44px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  background:var(--surface);font-weight:500;letter-spacing:.5px;
}
.export-btn:hover{color:var(--amber);border-color:var(--amber-deep);background:rgba(232,163,61,0.06);}
.export-btn svg{width:17px;height:17px;}

/* ===== 主区 ===== */
.app-main{max-width:1600px;margin:0 auto;padding:18px 18px 64px;}

/* 视图切换过渡 */
.view{animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* 核心提示条 */
.hook{
  display:flex;gap:14px;align-items:center;
  background:linear-gradient(135deg, rgba(232,163,61,0.10), rgba(232,163,61,0.03));
  border:1px solid rgba(232,163,61,0.28);
  border-radius:12px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap;
}
.hook .hook-label{
  font-family:var(--serif);font-weight:700;font-size:15px;color:var(--amber);white-space:nowrap;
}
.hook .hook-items{display:flex;gap:9px;flex-wrap:wrap;}
.hook-item{
  font-size:14px;color:var(--ink);background:rgba(232,163,61,0.07);
  border:1px solid rgba(232,163,61,0.20);padding:7px 14px;border-radius:999px;white-space:nowrap;
}
.hook-item b{color:var(--amber);font-weight:700;}

/* 周导航 */
.period-nav{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;
}
.period-nav .period-title{
  font-family:var(--serif);font-weight:700;font-size:20px;text-align:center;flex:1;
}
.nav-arrow{
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
  transition:border-color .15s,color .15s;
}
.nav-arrow:hover{color:var(--amber);border-color:var(--amber-deep);}
.nav-arrow:disabled{opacity:.3;cursor:not-allowed;}
.nav-arrow svg{width:18px;height:18px;}

/* ===== 周视图 ===== */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.week-day{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;min-height:150px;overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
}
.week-day:hover{border-color:var(--line-2);box-shadow:0 4px 16px rgba(0,0,0,0.15);}
.week-day.weekend{background:var(--bg-2);}
.week-day .day-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:6px;
  padding:13px 15px 10px;border-bottom:1px solid var(--line);
}
.week-day .day-head .dnum{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.5px;}
.week-day .day-head .dweek{font-size:14px;color:var(--ink-dim);letter-spacing:.5px;}
.week-day.sel{border-color:var(--amber);box-shadow:0 0 0 1px rgba(232,163,61,0.2);}
.week-day.sel .day-head{background:rgba(232,163,61,0.10);}
.week-day.sel .day-head .dnum{color:var(--amber);}
.week-day .day-events{display:flex;flex-direction:column;gap:11px;padding:13px;}
.ev-card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-left:5px solid;
  border-radius:10px;
  padding:13px 14px;
  text-align:left;
  min-height:52px;
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;
}
.ev-card:hover{
  transform:translateY(-1px);
  background:#222C3A;
  box-shadow:0 4px 14px rgba(0,0,0,0.22);
}
.ev-card.c-cn{border-left-color:var(--red);background:rgba(229,72,77,0.06);}
.ev-card.c-gl{border-left-color:var(--blue);background:rgba(90,169,230,0.06);}
.ev-card.c-ai{border-left-color:var(--orange);background:rgba(232,134,61,0.06);}
.ev-card.c-ne{border-left-color:var(--teal);background:rgba(53,178,154,0.06);}
.ev-card.key{
  border-left-color:var(--amber);
  border-color:rgba(232,163,61,0.38);
  background:rgba(232,163,61,0.08);
}
.ev-card.key:hover{background:rgba(232,163,61,0.13);}
.ev-card .ev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ev-card .ev-time{
  font-family:var(--mono);
  font-size:13.5px;
  color:var(--ink-dim);
  background:rgba(255,255,255,0.06);
  padding:3px 9px;
  border-radius:5px;
  white-space:nowrap;
  letter-spacing:.3px;
}
.ev-card .ev-badge{
  font-size:13px;
  font-weight:600;
  letter-spacing:.5px;
  padding:3px 10px;
  border-radius:999px;
  white-space:nowrap;
}
.ev-card.key .ev-badge{background:rgba(232,163,61,0.18);color:var(--amber);}
.ev-card.c-cn .ev-badge{background:rgba(229,72,77,0.15);color:#F0838A;}
.ev-card.c-gl .ev-badge{background:rgba(90,169,230,0.15);color:#8CC0EE;}
.ev-card.c-ai .ev-badge{background:rgba(232,134,61,0.15);color:#F2A96E;}
.ev-card.c-ne .ev-badge{background:rgba(53,178,154,0.15);color:#6FCBBB;}
.ev-card .ev-title{
  font-size:16px;
  font-weight:600;
  line-height:1.5;
  color:var(--ink);
  letter-spacing:.2px;
}
.week-day .empty{color:var(--ink-faint);font-size:13px;padding:8px 4px;}

/* ===== 月视图 ===== */
.month-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px;
}
.month-weekdays span{text-align:center;font-size:13px;color:var(--ink-faint);letter-spacing:.5px;padding:7px 0;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;}
.m-cell{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  min-height:96px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:7px;
  transition:border-color .15s,background .15s,transform .15s;
}
.m-cell:hover{border-color:var(--line-2);background:var(--surface-2);transform:translateY(-1px);}
.m-cell.other{opacity:.35;}
.m-cell.sel{border-color:var(--amber);background:rgba(232,163,61,0.08);}
.m-cell .m-num{font-family:var(--serif);font-weight:700;font-size:16.5px;letter-spacing:.3px;}
.m-cell.today .m-num{color:var(--amber);}
.m-cell .m-num .dot-today{
  display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);
  margin-left:2px;vertical-align:2px;
}
.m-cell .m-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;}
.m-dot{width:8px;height:8px;border-radius:50%;}
.m-dot.cn{background:var(--red);}
.m-dot.gl{background:var(--blue);}
.m-dot.ai{background:var(--orange);}
.m-dot.ne{background:var(--teal);}
.m-cell .m-sum{font-size:11.5px;color:var(--ink-faint);}
.day-list{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.day-list .dl-head{font-family:var(--serif);font-weight:700;font-size:17px;margin-bottom:12px;color:var(--amber);}
.day-list .dl-head .dl-date{color:var(--ink);}
.day-list .dl-empty{font-size:14px;color:var(--ink-faint);line-height:1.6;}

/* ===== 详情抽屉 ===== */
.scrim{
  position:fixed;inset:0;background:rgba(5,8,12,0.55);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:40;
}
.scrim.show{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:100%;max-width:430px;z-index:50;
  background:var(--bg-2);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.show{transform:translateX(0);}
.drawer-head{
  display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
}
.drawer-head .dh-title{font-family:var(--serif);font-weight:700;font-size:16px;flex:1;line-height:1.3;}
.drawer-close{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}
.drawer-close:hover{color:var(--ink);border-color:var(--line-2);}
.drawer-close svg{width:16px;height:16px;}
.drawer-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;}
.d-item{
  background:var(--surface);
  border:1px solid var(--line);
  border-left:4px solid;
  border-radius:10px;
  padding:14px 16px;
}
.d-item.key{border-left-color:var(--amber);border-color:rgba(232,163,61,0.35);background:rgba(232,163,61,0.06);}
.d-item.c-cn{border-left-color:var(--red);}
.d-item.c-gl{border-left-color:var(--blue);}
.d-item.c-ai{border-left-color:var(--orange);}
.d-item.c-ne{border-left-color:var(--teal);}
.d-item .d-title{font-size:17px;font-weight:700;line-height:1.5;margin-bottom:9px;letter-spacing:.2px;}
.d-item .d-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px;}
.d-chip{font-size:12.5px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);}
.d-item.key .d-chip.k{background:rgba(232,163,61,0.16);color:var(--amber);border-color:rgba(232,163,61,0.3);}
.d-item .d-desc{font-size:14.5px;color:var(--ink-dim);line-height:1.85;}

/* ===== 关注引导 ===== */
.brand-cta{
  border-top:1px solid var(--line);
  background:
    radial-gradient(900px 300px at 50% -40%, rgba(232,163,61,0.10), transparent 60%),
    linear-gradient(180deg, var(--bg-2), var(--bg));
  padding:34px 18px 30px;
}
.cta-inner{max-width:1600px;margin:0 auto;text-align:center;}
.cta-slogan{font-size:17px;color:var(--ink-dim);line-height:1.8;letter-spacing:.3px;}
.cta-slogan b{color:var(--ink);font-weight:600;}
.cta-actions{display:flex;align-items:center;justify-content:center;}
.cta-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--amber);color:#171207;font-weight:700;font-size:17px;
  padding:14px 38px;border-radius:999px;text-decoration:none;
  transition:transform .15s,box-shadow .15s,background .15s;
}
.cta-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,163,61,0.28);background:#F0B04F;}
.cta-btn svg{width:18px;height:18px;}
.cta-disclaimer{font-size:12.5px;color:var(--ink-faint);margin-top:22px;line-height:1.7;letter-spacing:.3px;}

/* ===== 导出长图预览 ===== */
.export-scrim{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(5,8,12,0.82);backdrop-filter:blur(6px);
  align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px 40px;
}
.export-scrim.show{display:flex;}
.export-panel{
  background:var(--bg);border:1px solid var(--line);border-radius:16px;
  max-width:760px;width:100%;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.export-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.export-panel-head .t{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:.5px;}
.export-close{
  background:none;border:none;color:var(--ink-dim);font-size:22px;line-height:1;cursor:pointer;padding:4px;
}
.export-close:hover{color:var(--ink);}
.export-img-wrap{
  border-radius:12px;overflow:hidden;background:#000;display:flex;justify-content:center;
  max-height:62vh;overflow-y:auto;
}
.export-img-wrap img{display:block;max-width:100%;height:auto;}
.export-panel-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.export-save{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--amber);color:#171207;font-weight:700;font-size:14px;
  padding:13px 20px;border-radius:12px;border:none;cursor:pointer;
  transition:transform .15s,box-shadow .15s,background .15s;
}
.export-save:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(232,163,61,0.28);background:#F0B04F;}
.export-hint{flex-basis:100%;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.6;}

/* 分享长图容器（渲染用，视觉隐藏） */
.share-stage{
  position:fixed;left:-9999px;top:0;width:720px;
  background:#0E1218;color:#EAE7E0;font-family:'Noto Sans SC',sans-serif;
  padding:0;z-index:-1;opacity:0;pointer-events:none;
}
.share-card{background:#0E1218;padding:34px 32px 30px;}
.share-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.share-brand{font-size:34px;font-weight:900;color:#E5484D;letter-spacing:2px;font-family:'Noto Serif SC',serif;}
.share-brand small{font-size:17px;color:#9AA3AF;font-weight:500;letter-spacing:1px;margin-left:6px;}
.share-daily{font-size:12.5px;color:#5F6875;letter-spacing:1px;}
.share-title{
  font-size:20px;font-weight:700;color:#EAE7E0;margin:14px 0 20px;
  padding-bottom:14px;border-bottom:1px solid #25303E;letter-spacing:.5px;
}
.share-day{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid #1C2531;}
.share-day:last-child{border-bottom:none;}
.share-date{flex:0 0 96px;}
.share-date .md{font-size:20px;font-weight:800;color:#E8A33D;letter-spacing:.5px;}
.share-date .wd{font-size:12px;color:#5F6875;margin-top:3px;letter-spacing:1px;}
.share-events{flex:1;display:flex;flex-direction:column;gap:10px;}
.share-ev{display:flex;align-items:flex-start;gap:10px;}
.share-ev .t{font-size:14.5px;font-weight:600;color:#EAE7E0;line-height:1.5;flex:1;}
.share-ev .k{font-size:11px;flex:0 0 auto;margin-top:1px;padding:2px 8px;border-radius:999px;font-weight:600;}
.share-ev .k.cn{background:rgba(229,72,77,0.14);color:#E5484D;border:1px solid rgba(229,72,77,0.35);}
.share-ev .k.gl{background:rgba(90,169,230,0.14);color:#5AA9E6;border:1px solid rgba(90,169,230,0.35);}
.share-ev .k.ai{background:rgba(232,134,61,0.14);color:#E8863D;border:1px solid rgba(232,134,61,0.35);}
.share-ev .k.ne{background:rgba(53,178,154,0.14);color:#35B29A;border:1px solid rgba(53,178,154,0.35);}
.share-ev .k.ky{background:rgba(232,163,61,0.16);color:#E8A33D;border:1px solid rgba(232,163,61,0.4);}
.share-ev .tm{font-size:11.5px;color:#5F6875;flex:0 0 44px;margin-top:2px;}
.share-foot{margin-top:22px;padding-top:16px;border-top:1px solid #25303E;text-align:center;}
.share-foot .ct{font-size:15px;color:#EAE7E0;font-weight:700;letter-spacing:.5px;}
.share-foot .ct b{color:#E8A33D;}
.share-foot .dis{font-size:10.5px;color:#5F6875;margin-top:8px;line-height:1.6;letter-spacing:.3px;}

/* ===== 响应式 ===== */
@media (max-width: 900px){
  .week-grid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width: 768px){
  .header-inner{gap:10px;padding:12px 14px;flex-wrap:wrap;}
  .brand{flex:1 1 auto;min-width:0;}
  .brand .sub{
    display:inline;
    font-size:11.5px;
    padding-left:10px;
    margin-left:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:calc(100% - 60px);
    flex:1;
    min-width:0;
    border-left:1px solid var(--line);
    padding-right:4px;
  }
  .brand-logo img{height:42px;}
  .header-actions{
    width:100%;
    margin-left:0;
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:8px;
    align-items:stretch;
  }
  .header-actions .today-btn{
    justify-self:stretch;
  }
  .header-actions .seg{
    min-width:0;
  }
  .header-actions .seg button{
    font-size:13px;padding:7px 10px;min-height:38px;
  }
  .today-btn{
    font-size:12.5px;padding:7px 12px;min-height:38px;
    white-space:nowrap;
  }
  .export-btn{
    font-size:12.5px;padding:7px 12px;min-height:38px;
    white-space:nowrap;
    display:inline-flex;align-items:center;justify-content:center;
    color:#C9D1DC;
  }
  .export-btn .export-label{display:inline;}
  .export-btn svg{width:15px;height:15px;color:#C9D1DC;}
  .app-main{padding:14px 14px 56px;}
  .week-grid{grid-template-columns:1fr;}
  .week-day{min-height:0;}
  .month-grid{gap:5px;}
  .m-cell{min-height:58px;padding:5px 6px;}
  .m-cell .m-num{font-size:12.5px;}

/* ================= 状态 ================= */
var WEEK_BASE = new Date(2026, 7, 31);   // 8月31日（周一）

/* 打开页面时：默认定位到“今天”所在周、选中当天，便于第一时间看当日节点 */
var state = (function(){
  var now = new Date();
  var todayISO = iso(now);
  // 今天所在周相对基准周的偏移（若早于基准周则归0）
  var diff = Math.round((now - WEEK_BASE) / 86400000);
  var off = Math.floor(diff / 7);
  if(off < 0) off = 0;
  var mo = now.getFullYear(), mm = now.getMonth()+1;
  return {
    view: 'week',
    weekOffset: off,
    month: { y: mo, m: mm },
    selDate: todayISO,
    monthSel: todayISO
  };
})();

/* ================= 工具函数 ================= */
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function addWeeks(d,n){ return addDays(d, n*7); }
function weekdayCN(d){ return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }
function fmtMD(d){ return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function fmtYMD(d){ return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================= 路由 ================= */
function route(){
  var h = location.hash || '#/week';
  var view = h.indexOf('month')>=0 ? 'month' : 'week';
  if(view !== state.view){
    state.view = view;
    document.getElementById('view-week').hidden = (view!=='week');
    document.getElementById('view-month').hidden = (view!=='month');
    document.getElementById('segWeek').classList.toggle('active', view==='week');
    document.getElementById('segMonth').classList.toggle('active', view==='month');
    render();
  }
}
window.addEventListener('hashchange', route);

/* ================= 渲染：周视图 ================= */
function evCardHTML(ev, dateISO){
  var badge = ev.key ? '重点' : CATS[ev.cat];
  return '<button class="ev-card key c-'+ev.cat+'" data-date="'+dateISO+'" data-i="'+ev._i+'">'+
    '<span class="ev-top"><span class="ev-time">'+(ev.time||'全天')+'</span><span class="ev-badge">'+esc(badge)+'</span></span>'+
    '<span class="ev-title">'+esc(ev.title)+'</span>'+
  '</button>';
}

function renderWeek(){
  var base = addWeeks(WEEK_BASE, state.weekOffset);
  var monday = base;
  var sunday = addDays(monday, 6);
  document.getElementById('weekTitle').textContent = fmtMD(monday)+' — '+fmtMD(sunday);
  document.getElementById('prevWeek').disabled = (state.weekOffset <= -1);
  document.getElementById('nextWeek').disabled = false;

  var grid = document.getElementById('weekGrid');
  var html = '';
  for(var i=0;i<7;i++){
    var d = addDays(monday, i);
    var diso = iso(d);
    var evs = EVENTS[diso] || [];
    var isWeekend = (d.getDay()===0 || d.getDay()===6);
    var sel = (diso===state.selDate) ? ' sel' : '';
    var evHtml = '';
    if(evs.length){
      evs.forEach(function(ev,k){ ev._i = k; evHtml += evCardHTML(ev, diso); });
    } else {
      evHtml = '<span class="empty">'+(state.weekOffset===0?'—':'暂无事件数据')+'</span>';
    }
    html += '<div class="week-day'+(isWeekend?' weekend':'')+sel+'" data-date="'+diso+'">'+
      '<div class="day-head"><span class="dnum">'+(d.getMonth()+1)+'/'+d.getDate()+'</span><span class="dweek">'+weekdayCN(d)+'</span></div>'+
      '<div class="day-events">'+evHtml+'</div>'+
    '</div>';
  }
  grid.innerHTML = html;
}

/* ================= 渲染：月视图 ================= */
function renderMonth(){
  var y = state.month.y, m = state.month.m;
  document.getElementById('monthTitle').textContent = y+'年'+m+'月';
  document.getElementById('prevMonth').disabled = false;
  document.getElementById('nextMonth').disabled = false;

  var first = new Date(y, m-1, 1);
  var offset = (first.getDay()+6)%7;   // 周一开头
  var daysInMonth = new Date(y, m, 0).getDate();
  var today = new Date();
  var todayISO = iso(today);

  var grid = document.getElementById('monthGrid');
  var html = '';
  var i;
  for(i=0;i<offset;i++){ html += '<div class="m-cell other"></div>'; }
  for(i=1;i<=daysInMonth;i++){
    var d = new Date(y, m-1, i);
    var diso = iso(d);
    var evs = EVENTS[diso] || [];
    var isToday = (diso===todayISO);
    var sel = (diso===state.monthSel) ? ' sel' : '';
    var dots = '';
    var catsSeen = {};
    evs.forEach(function(ev){ if(!catsSeen[ev.cat]){ catsSeen[ev.cat]=true; dots += '<span class="m-dot '+ev.cat+'"></span>'; } });
    var sum = evs.length ? '<span class="m-sum">'+evs.length+' 项</span>' : '';
    html += '<button class="m-cell'+sel+'" data-date="'+diso+'">'+
      '<span class="m-num">'+i+(isToday?'<span class="dot-today"></span>':'')+'</span>'+
      '<span class="m-dots">'+dots+'</span>'+sum+
    '</button>';
  }
  grid.innerHTML = html;
  renderDayList();
}

function renderDayList(){
  var d = parseISO(state.monthSel);
  var evs = EVENTS[state.monthSel] || [];
  var box = document.getElementById('dayList');
  if(!evs.length){
    box.innerHTML = '<div class="dl-head">'+fmtYMD(d)+'</div><div class="dl-empty">当天暂无重点事件。已收录的事件数据覆盖 8/24 — 9/25，可切换到其他日期查看。</div>';
    return;
  }
  var items = evs.map(function(ev,k){
    return '<div class="d-item key c-'+ev.cat+'">'+
      '<div class="d-title">'+esc(ev.title)+'</div>'+
      '<div class="d-meta"><span class="d-chip">'+(ev.time||'全天')+'</span><span class="d-chip">'+CATS[ev.cat]+'</span>'+(ev.key?'<span class="d-chip k">重点</span>':'')+'</div>'+
      '<div class="d-desc">'+esc(ev.desc)+'</div>'+
    '</div>';
  }).join('');
  box.innerHTML = '<div class="dl-head">'+fmtYMD(d)+' · 共'+evs.length+'项</div>'+items;
}

/* ================= 详情抽屉 ================= */
function openDrawer(dateISO, evIndex){
  var ev = EVENTS[dateISO][evIndex];
  var d = parseISO(dateISO);
  document.getElementById('drawerTitle').textContent = fmtYMD(d)+' · '+weekdayCN(d);
  document.getElementById('drawerBody').innerHTML =
    '<div class="d-item key c-'+ev.cat+'">'+
      '<div class="d-title">'+esc(ev.title)+'</div>'+
      '<div class="d-meta"><span class="d-chip">'+(ev.time||'全天')+'</span><span class="d-chip">'+CATS[ev.cat]+'</span>'+(ev.key?'<span class="d-chip k">重点</span>':'')+'</div>'+
      '<div class="d-desc">'+esc(ev.desc)+'</div>'+
    '</div>';
  showDrawer(true);
}
function showDrawer(show){
  document.getElementById('drawer').classList.toggle('show', show);
  document.getElementById('scrim').classList.toggle('show', show);
  document.getElementById('drawer').setAttribute('aria-hidden', show?'false':'true');
}

/* ================= 主渲染 ================= */
function render(){
  if(state.view==='week'){ renderWeek(); }
  else{ renderMonth(); }
}

/* ================= 事件绑定 ================= */
document.addEventListener('click', function(e){
  var card = e.target.closest('.ev-card');
  if(card){ openDrawer(card.dataset.date, +card.dataset.i); return; }

  var cell = e.target.closest('.m-cell[data-date]');
  if(cell){ state.monthSel = cell.dataset.date; renderMonth(); return; }

  var wd = e.target.closest('.week-day[data-date]');
  if(wd){ state.selDate = wd.dataset.date; renderWeek(); return; }
});

document.getElementById('prevWeek').addEventListener('click', function(){ state.weekOffset--; renderWeek(); });
document.getElementById('nextWeek').addEventListener('click', function(){ state.weekOffset++; renderWeek(); });
document.getElementById('prevMonth').addEventListener('click', function(){ changeMonth(-1); });
document.getElementById('nextMonth').addEventListener('click', function(){ changeMonth(1); });
function changeMonth(delta){
  var m = state.month.m + delta;
  var y = state.month.y;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  state.month = { y:y, m:m };
  renderMonth();
}

document.getElementById('todayBtn').addEventListener('click', function(){
  // 切换到周视图并回到本周
  if(state.view !== 'week'){
    state.view = 'week';
    document.getElementById('view-week').hidden = false;
    document.getElementById('view-month').hidden = true;
    document.getElementById('segWeek').classList.add('active');
    document.getElementById('segMonth').classList.remove('active');
    if(location.hash.indexOf('month') >= 0){ location.hash = '#/week'; }
  }
  state.weekOffset = 0;
  renderWeek();
});

document.getElementById('segWeek').addEventListener('click', function(){ if(location.hash.indexOf('month')>=0){ location.hash='#/week'; } else { render(); } });
document.getElementById('segMonth').addEventListener('click', function(){ if(location.hash.indexOf('month')<0){ location.hash='#/month'; } else { render(); } });

document.getElementById('drawerClose').addEventListener('click', function(){ showDrawer(false); });
document.getElementById('scrim').addEventListener('click', function(){ showDrawer(false); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ showDrawer(false); } });

/* 启动 */
route();
render();

/* ================= 导出长图 ================= */
function buildShareCard(){
  var card = document.getElementById('shareCard');
  var view = state.view;
  var rangeStart, rangeEnd, titleTxt;
  if(view==='week'){
    rangeStart = addWeeks(WEEK_BASE, state.weekOffset);
    rangeEnd = addDays(rangeStart, 6);
    titleTxt = '本周事件 · ' + fmtMD(rangeStart) + ' — ' + fmtMD(rangeEnd);
  } else {
    rangeStart = new Date(state.month.y, state.month.m-1, 1);
    rangeEnd = new Date(state.month.y, state.month.m, 0);
    titleTxt = state.month.y + '年' + state.month.m + '月 · 全月事件';
  }

  var html = '';
  html += '<div class="share-head">'+
    '<span class="share-brand">投资日历<small>INVESTOR CALENDAR</small></span>'+
    '<span class="share-daily">每日更新</span>'+
  '</div>';
  html += '<div class="share-title">'+titleTxt+'</div>';

  var cur = rangeStart;
  var guard = 0;
  while(cur <= rangeEnd && guard < 70){
    guard++;
    var diso = iso(cur);
    var evs = EVENTS[diso] || [];
    if(evs.length){
      var isWeekend = (cur.getDay()===0 || cur.getDay()===6);
      html += '<div class="share-day">'+
        '<div class="share-date"><div class="md">'+(cur.getMonth()+1)+'/'+cur.getDate()+'</div>'+
        '<div class="wd">'+weekdayCN(cur)+(isWeekend?' · 休市':'')+'</div></div>'+
        '<div class="share-events">';
      evs.forEach(function(ev){
        var badge = ev.key ? '<span class="k ky">重点</span>' : '<span class="k '+ev.cat+'">'+CATS[ev.cat]+'</span>';
        html += '<div class="share-ev">'+
          '<span class="tm">'+(ev.time||'全天')+'</span>'+
          '<span class="t">'+esc(ev.title)+'</span>'+badge+
        '</div>';
      });
      html += '</div></div>';
    }
    cur = addDays(cur, 1);
  }
  if(html.indexOf('share-day') < 0){
    html += '<div style="text-align:center;color:#5F6875;padding:40px 0;">当前范围内暂无事件数据</div>';
  }

  html += '<div class="share-foot">'+
    '<div class="ct">关注 <b>投资日历</b>（抖音号：97551689999）</div>'+
    '<div class="dis">本日历仅作公开信息整理与展示，不构成任何投资建议；市场有风险，投资需谨慎。</div>'+
  '</div>';
  card.innerHTML = html;
}

function exportLongImage(){
  buildShareCard();
  var stage = document.getElementById('shareStage');
  var scrim = document.getElementById('exportScrim');
  var wrap = document.getElementById('exportImgWrap');
  wrap.innerHTML = '<div style="padding:30px;color:#9AA3AF;font-size:14px;">正在生成图片…</div>';
  scrim.classList.add('show');
  scrim.setAttribute('aria-hidden','false');

  // 延迟以确保样式渲染
  setTimeout(function(){
    html2canvas(document.getElementById('shareCard'), {
      scale: 2,
      useCORS: true,
      backgroundColor: '#0E1218',
      logging: false,
      windowWidth: 720
    }).then(function(canvas){
      var img = document.createElement('img');
      img.src = canvas.toDataURL('image/png');
      img.alt = '投资者日历长图';
      img.style.width = '100%';
      wrap.innerHTML = '';
      wrap.appendChild(img);
    }).catch(function(err){
      wrap.innerHTML = '<div style="padding:30px;color:#E5484D;font-size:14px;">生成失败，请重试或更换浏览器。</div>';
      console.error('export error', err);
    });
  }, 120);
}

document.getElementById('exportBtn').addEventListener('click', exportLongImage);
document.getElementById('exportClose').addEventListener('click', function(){
  document.getElementById('exportScrim').classList.remove('show');
  document.getElementById('exportScrim').setAttribute('aria-hidden','true');
});
document.getElementById('exportScrim').addEventListener('click', function(e){
  if(e.target === this){
    this.classList.remove('show');
    this.setAttribute('aria-hidden','true');
  }
});
document.getElementById('exportSave').addEventListener('click', function(){
  var img = document.querySelector('#exportImgWrap img');
  if(!img){ return; }
  var a = document.createElement('a');
  a.href = img.src;
  a.download = '投资者日历_'+iso(new Date())+'.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});
</script>
